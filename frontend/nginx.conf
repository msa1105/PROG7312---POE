server {
    listen 80;
    server_name localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # Client-side routes (/ingestion, /commands, ...) fall back to the SPA entry point
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        client_max_body_size 30m;
    }

    # SignalR hub: negotiate over HTTP, then upgrade to a long-lived WebSocket
    # Reference: Microsoft, 2026b. ASP.NET Core SignalR production hosting and scaling. [online] Available at: <https://learn.microsoft.com/en-us/aspnet/core/signalr/scale> [Accessed 19 October 2026].
    location /hubs/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_cache_bypass $http_upgrade;
    }
}
