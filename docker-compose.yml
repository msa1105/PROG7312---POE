services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      # Optional: nginx reaches the API over the internal network. Override with SMARTX_API_PORT if 5000 is taken.
      - "${SMARTX_API_PORT:-5000}:5000"
    environment:
      # Optional: supply a base64 32-byte key (e.g. `openssl rand -base64 32`); otherwise one is generated into the keys volume
      - Encryption__MasterKey=${SMARTX_ENCRYPTION_KEY:-}
    volumes:
      - smartx-uploads:/app/Uploads
      - smartx-keys:/app/keys
    networks:
      - smartx-mesh-net

  # ESP32 fleet simulator: sends telemetry and acknowledges commands over HTTP like real devices
  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    environment:
      - SMARTX_API_URL=http://backend:5000
    networks:
      - smartx-mesh-net
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${SMARTX_WEB_PORT:-3000}:80"
    networks:
      - smartx-mesh-net
    depends_on:
      - backend

volumes:
  smartx-uploads:
  smartx-keys:

networks:
  smartx-mesh-net:
    driver: bridge
